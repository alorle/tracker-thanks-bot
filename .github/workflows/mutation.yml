name: Mutation

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - stryker.config.mjs
      - package.json
      - package-lock.json
      - .github/workflows/mutation.yml
  schedule:
    # A run from scratch every Monday: pull requests only re-test what changed,
    # and this is what stops that baseline from drifting.
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  stryker:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore the incremental mutation report
        uses: actions/cache@v6
        with:
          path: reports/stryker-incremental.json
          key: ${{ runner.os }}-stryker-${{ github.sha }}
          restore-keys: ${{ runner.os }}-stryker-

      - name: Run Stryker
        run: npm run test:mutation -- ${{ github.event_name == 'pull_request' && '--incremental' || '--incremental --force' }}

      - name: Summarise the mutation score
        if: always() && hashFiles('reports/mutation/mutation.json') != ''
        run: |
          node --input-type=module -e '
          import { readFileSync, appendFileSync } from "node:fs";
          const report = JSON.parse(readFileSync("reports/mutation/mutation.json", "utf8"));
          const score = (mutants) => {
            const count = (...statuses) => mutants.filter((m) => statuses.includes(m.status)).length;
            const detected = count("Killed", "Timeout");
            const valid = detected + count("Survived", "NoCoverage");
            return { text: valid ? `${((detected / valid) * 100).toFixed(2)}%` : "n/a", survived: count("Survived", "NoCoverage") };
          };
          const files = Object.entries(report.files);
          const total = score(files.flatMap(([, file]) => file.mutants));
          const rows = files.map(([path, file]) => {
            const s = score(file.mutants);
            return `| \`${path}\` | ${s.text} | ${s.survived} |`;
          });
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            "### Mutation testing",
            "",
            `Score **${total.text}** (break at ${report.thresholds.break}%), ${total.survived} mutants survived. Full report in the \`mutation-report\` artifact.`,
            "",
            "| File | Score | Survived |",
            "| --- | --- | --- |",
            ...rows,
          ].join("\n") + "\n");
          '

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
