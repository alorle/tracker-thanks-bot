name: Mutation

on:
  pull_request:
    branches: [main]
  schedule:
    # A run from scratch every Monday: pull requests only re-test what changed,
    # and this is what stops that baseline from drifting.
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  stryker:
    name: Mutation testing
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore the incremental mutation report
        uses: actions/cache@v6
        with:
          path: reports/stryker-incremental.json
          key: ${{ runner.os }}-stryker-${{ github.sha }}
          restore-keys: ${{ runner.os }}-stryker-

      - name: Run Stryker
        run: npm run test:mutation -- ${{ github.event_name == 'pull_request' && '--incremental' || '' }}

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
